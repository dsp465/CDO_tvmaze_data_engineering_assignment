trigger:
  branches:
    include:
      - main
      - acc
      - dev
      - feature/*

variables:
  - group: tvmaze-keyvault-secrets
  - name: environment
    value: dev   # Override in pipeline UI for acc/prod

stages:

# -------------------------
# CI Stage
# -------------------------
- stage: CI
  displayName: "Run Unit Tests"
  jobs:
    - job: run_tests
      pool:
        vmImage: ubuntu-latest
      steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.10'

        - script: pip install -r requirements.txt
          displayName: "Install dependencies"

        - script: pytest unit_tests/
          displayName: "Execute unit tests"

# -------------------------
# CD Stage
# -------------------------
- stage: CD
  displayName: "Deploy Databricks Asset Bundle"
  dependsOn: CI
  condition: succeeded()

  variables:
    DATABRICKS_HOST: $(databricks-host)
    DATABRICKS_TOKEN: $(databricks-token)

  jobs:
    - job: deploy_bundle
      pool:
        vmImage: ubuntu-latest
      steps:

        - script: |
            echo "Deploying to environment: $(environment)"
            databricks bundle validate -t $(environment)
            databricks bundle deploy -t $(environment)
          displayName: "Validate & Deploy Bundle"

        - script: |
            databricks bundle run tvmaze_job -t $(environment)
          displayName: "Run Workflow Job"

        - script: echo "Deployment completed successfully."
          displayName: "Done"
