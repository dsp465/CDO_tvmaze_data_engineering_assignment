trigger:
  branches:
    include:
      - main
      - feature/data_assignment

variables:
  - group: tvmaze-keyvault-secrets
  - name: environment
    value: dev   # can be overridden in pipeline UI

stages:

# -------------------------
# CI Stage
# -------------------------
- stage: CI
  displayName: "Run Tests"
  jobs:
    - job: tests
      pool:
        vmImage: ubuntu-latest
      steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.10'

        - script: pip install -r requirements.txt
          displayName: "Install dependencies"

        - script: pytest tests/
          displayName: "Execute unit tests"

# -------------------------
# CD Stage
# -------------------------
- stage: Deploy
  displayName: "Deploy to Databricks"
  dependsOn: CI
  condition: succeeded()

  variables:
    DATABRICKS_HOST: $(databricks-host)
    DATABRICKS_TOKEN: $(databricks-token)

  jobs:
    - job: deploy
      pool:
        vmImage: ubuntu-latest
      steps:

        # Select environment-specific config
        - script: |
            echo "Using environment: $(environment)"
            cp configs/$(environment).json active_config.json
          displayName: "Select environment config"

        - script: |
            databricks workspace import_dir notebooks/ /Shared/tvmaze/ --overwrite
          displayName: "Deploy notebooks"

        - script: |
            databricks jobs reset \
              --job-id $(tvmaze-job-id) \
              --json-file active_config.json
          displayName: "Deploy job"

        - script: echo "Deployment completed"
          displayName: "Done"
